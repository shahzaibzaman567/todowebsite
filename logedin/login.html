<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To Website</title>
    <link rel="stylesheet" href="style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<style>
body{
    background: linear-gradient(135deg, 
  #ff4b2b, /* Warm Red */
  #ff416c, /* Pinkish Red */
  #2193b0, /* Sky Blue */
  #6dd5ed, /* Light Blue */
  #ffffff  /* White touch for freshness */
);
height: 600px;
}

#h1{
    margin: auto;
    font-size: 45px;
    width: 10%;
}    
@media(max-width:500px){
    #h1{
width: 0%;
margin: 0%;
    }
    #inputdiv {
        border: none;
    }
}
@media(max-width=555px){

#S-btn {
    border-color: white;
    color: white;
    width: 35%;
    height: 7%;
    margin-left: 1%;
}

}
</style>
  </head>
  <body>
    <a href="index.html">
    <button type="button" id="S-btn" class="btn btn-outline-primary">Sign-up</button>
  </a>
    <h1 style="width: 400px; color: azure;"></h1>
    <div id="inputdiv" style="background: linear-gradient(135deg, 
    #ff4b2b, /* Warm Red */
    #ff416c, /* Pinkish Red */
    #2193b0, /* Sky Blue */
    #6dd5ed, /* Light Blue */
    #ffffff  /* White touch for freshness */
  );height: 85%;

  ">
  <h1 id="h1">Login</h1>
  <form id="loginform" >
  <div class="form-floating mb-3  input">
        <!-- Email address: -->
        <input type="email" class="form-control"   id="email" placeholder="name@example.com" required="">
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating">
        <!-- Password: -->
        <input type="password" class="form-control"  id="password" placeholder="Password" required>
        <label for="floatingPassword">Password</label><br><br>
        <p  id="para"></p><br>
        <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="invalidCheck"  >
              <label class="form-check-label" for="invalidCheck">
                <i style="color: white;">Agree to terms and conditions </i>
              </label>
              <div class="invalid-feedback">
                You must agree before submitting.
              </div>
            </div>
          </div><br><br>
        <button  style="width: 100%;" type="submit" class="btn btn-danger" id="btn" >Login</button>
        
      </div>
    </form>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>

<script src="app2.js"></script>












  </body>
</html>
